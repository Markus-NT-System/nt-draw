# Bygger Windows-installationen och lägger upp den som en GitHub Release.
# Starta den under fliken Actions → "Bygg och publicera" → Run workflow.
# Releasen får versionen i package.json (t.ex. v1.0.1) – höj den innan varje ny utgåva.
name: Bygg och publicera

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
